services:
  # Backend API
  - type: web
    name: iris-backend
    runtime: python
    region: oregon
    buildCommand: |
      cd backend && pip install -r requirements.txt &&
      cd ../rag && pip install -r requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.0"
      # File watcher enabled - backend can access shared persistent disk
      - key: ENABLE_FILE_WATCHER
        value: "true"
      # Shared paths on persistent disk
      - key: SCRAPER_OUTPUT_PATH
        value: "/data/scraper_output"
      - key: VECTOR_STORE_PATH
        value: "/data/vector_store"
    healthCheckPath: /health
    # Persistent disk for vector store and scraped files
    disk:
      name: iris-data
      mountPath: /data
      sizeGB: 1

  # Frontend Static Site
  - type: web
    name: iris-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_API_BASE
        value: "https://iris-backend-4btb.onrender.com"

  # Scraper (Background Worker)
  # Shares persistent disk with backend for file-based communication
  - type: worker
    name: iris-scraper
    runtime: python
    region: oregon
    buildCommand: cd scraper && pip install -r requirements.txt && playwright install chromium
    startCommand: |
      cd scraper &&
      while true; do
        python src/run_scraper.py;
        echo "Scraper completed, sleeping for 3 hours...";
        sleep 10800;
      done
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      # Path to shared disk for scraped output
      - key: SCRAPER_OUTPUT_PATH
        value: "/data/scraper_output"
    # Shared persistent disk - same as backend
    disk:
      name: iris-data
      mountPath: /data
      sizeGB: 1

# Database - Optional, only if you add PostgreSQL later
